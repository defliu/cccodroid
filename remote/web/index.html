<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>cccodroid remote</title>
<style>
  :root { color-scheme: dark light; --bg:#0f1115; --panel:#171a21; --line:#2a303c; --fg:#e7ebf3; --dim:#8a93a6; --accent:#c96442; --ok:#3fbf7f; --bad:#e05c5c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:18px; margin:0 0 4px; letter-spacing:.2px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--dim); margin:10px 0 6px; letter-spacing:.4px; text-transform:uppercase; }
  input, select { width:100%; background:#0d1015; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:inherit; }
  input.mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:1px; }
  select { min-width:0; }
  .msg.think { color:#8a93a6; font-style:italic; }
  .msg.tool { color:#7fb3d5; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  button { border:0; border-radius:8px; padding:10px 14px; font:inherit; font-weight:600; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  button:disabled { opacity:.45; cursor:default; }
  .status { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .dot.ok { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .dot.bad { background:var(--bad); }
  #log { min-height:220px; max-height:52vh; overflow:auto; background:#0d1015; border:1px solid var(--line); border-radius:8px; padding:12px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; white-space:pre-wrap; }
  .msg { margin:0 0 8px; }
  .msg.me { color:#f0b8a5; }
  .msg.them { color:var(--fg); }
  .msg.sys { color:var(--dim); font-style:italic; }
  #log .more { display:block; width:100%; margin:0 0 10px; padding:6px 10px; font:inherit; font-size:12px; font-weight:600; background:transparent; border:1px solid var(--line); color:var(--dim); }
  #log .more.hidden { display:none; }
  .composer { display:flex; gap:8px; margin-top:10px; }
  .composer input { flex:1; }
  .hint { color:var(--dim); font-size:12px; margin-top:8px; }
  .hidden { display:none; }
</style>
<main>
  <h1>cccodroid remote</h1>
  <div class="sub">端到端加密的远程通道 · 中继只转发密文</div>

  <section class="card" id="pairCard">
    <div class="row">
      <div>
        <label>房间</label>
        <input id="room" class="mono" placeholder="16 位十六进制" autocomplete="off" spellcheck="false" />
      </div>
      <div>
        <label>配对码</label>
        <input id="code" class="mono" placeholder="26 位配对码" autocomplete="off" spellcheck="false" />
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="connect">连接</button>
      <button id="disconnect" class="ghost" disabled>断开</button>
    </div>
    <div class="hint">在 cccodroid 里生成配对码；也可以用带 #room=…&amp;code=… 的链接直接打开。</div>
  </section>

  <section class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="state">未连接</span></div>
    <div class="row" style="margin-top:10px">
      <select id="session" disabled>
        <option value="">新会话</option>
      </select>
      <button id="refresh" class="ghost" disabled>刷新</button>
      <button id="stop" class="ghost" disabled>停止</button>
    </div>
  </section>

  <section class="card">
    <div id="log"></div>
    <div class="composer">
      <input id="text" placeholder="输入消息…" autocomplete="off" disabled />
      <button id="send" disabled>发送</button>
    </div>
  </section>
</main>
<script type="module" src="/app.js"></script>
</html>
